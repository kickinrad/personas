name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run central gate
        run: bash tests/run-tests.sh

      - name: Verify source export
        run: |
          export_root=$(mktemp -d)
          git archive HEAD | tar -x -C "$export_root"
          bash "$export_root/tests/run-tests.sh"
