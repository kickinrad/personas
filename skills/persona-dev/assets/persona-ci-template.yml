name: Persona privacy gate

on:
  push:
  pull_request:

jobs:
  private-repository-only:
    runs-on: ubuntu-latest
    steps:
      - name: Require a private repository
        run: |
          if [ "${{ github.event.repository.private }}" != "true" ]; then
            echo "Personalized Cloud personas require a private repository."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Reject private state and credentials
        run: .claude/hooks/public-repo-guard.sh --check-tree HEAD
